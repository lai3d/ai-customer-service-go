# Included into every location rather than set once on the server.
#
# nginx's add_header is not inherited into a block that has any add_header of its own, so
# the server-level policy silently vanished from `/` -- the one response that matters,
# because the location for index.html sets a Cache-Control. The config looked right and
# `curl -I /` came back with no Content-Security-Policy at all.
#
# This application renders text a customer wrote and loads no third-party script.
# 'unsafe-inline' for styles is antd's runtime CSS-in-JS; connect-src has to be wide
# because the API's origin is deployment configuration, not a build-time constant.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src *; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
