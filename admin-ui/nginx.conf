# Served by nginxinc/nginx-unprivileged, so this listens on 8080 as a non-root user.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;

    # A single-page application: every path that is not a file is the application.
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # index.html and config.js decide which build and which API the browser uses. Cached,
    # they are how a deployment appears to have worked and then serves yesterday's bundle
    # pointed at yesterday's API.
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }
    # Not in the web root: see docker-entrypoint.sh. The default below is what a
    # `docker run` with no ADMIN_API_BASE gets, so the page loads and says so rather than
    # failing on a missing script.
    location = /config.js {
        alias /tmp/admin-config/config.js;
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Vite fingerprints these, so they can be cached hard and forever.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
