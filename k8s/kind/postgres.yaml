# A throwaway Postgres, for verifying the manifests on kind and for nothing else.
#
# It lives here rather than in k8s/ on purpose. This app keeps business data and the
# pgvector embeddings in the same database, which makes it a system of record; k8s/README.md
# explains why this repository ships no Postgres manifest for real clusters. An emptyDir and
# a hardcoded password are fine for a cluster whose whole life is one `verify.sh` run and
# are not fine for anything else.
#
# Being in a subdirectory also keeps it out of `kubectl apply -f k8s/`.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ai-customer-service-go
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: test-fixture
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ai-customer-service-go
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: test-fixture
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          # The same image the Testcontainers suite and docker-compose.yml use, so the
          # `vector` extension is present without an init script.
          image: pgvector/pgvector:pg17
          env:
            - name: POSTGRES_DB
              value: csagent
            - name: POSTGRES_USER
              value: csagent
            - name: POSTGRES_PASSWORD
              value: csagent
            # The default PGDATA is the mount point itself, which Postgres refuses to
            # initialise when it is not empty. A subdirectory sidesteps that.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "csagent", "-d", "csagent"]
            periodSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
# "Postgres accepts only the app", which is an edge k8s/networkpolicy.yaml cannot express
# because these manifests ship no Postgres: on a real cluster the database is a managed
# instance outside this namespace and its firewall belongs to whoever runs it. Here there
# is a Postgres pod, so here is the policy that protects it.
#
# It matters more than it looks. k8s/networkpolicy.yaml's default-deny already stops
# anything in this namespace opening a socket, but that is an *egress* rule on the client
# side; this is the ingress rule on the server side, and the two fail differently. A pod
# that talks its way past the first -- an unlabelled sidecar, a debug pod someone runs
# with `kubectl run`, a future component that copies the app's egress policy -- still gets
# nothing from the database.
#
# verify.sh proves it by running exactly that pod: no labels, in this namespace, told to
# open 5432 on the Postgres Service. It has to be refused, and if the CNI does not enforce
# NetworkPolicy at all, that assertion is the one that goes red rather than every "allow"
# passing for free.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: ai-customer-service-go
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: test-fixture
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ai-customer-service-go
              app.kubernetes.io/component: app
      ports:
        - protocol: TCP
          port: 5432
