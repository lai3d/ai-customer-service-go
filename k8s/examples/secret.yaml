# TEMPLATE ONLY -- every value below is a placeholder. Do not `kubectl apply -f` this
# file as-is, and do not fill it in and commit it.
#
# It lives in k8s/examples/ rather than k8s/ because of something the Java implementation
# of this system measured the hard way: sitting next to the other manifests, `kubectl
# apply -f k8s/` -- the first thing anyone types -- swept it up and replaced a working
# Secret with these placeholders. kubectl's only complaint was a warning that ends "The
# missing annotation will be patched automatically", which reads like reassurance. A
# prose warning did not stop it. `kubectl apply -f <dir>` is not recursive, so a
# subdirectory does.
#
# Preferred: create the Secret imperatively, so real values never touch a file git sees.
#
#   kubectl -n ai-customer-service-go create secret generic ai-customer-service-go-secrets \
#     --from-literal=ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
#     --from-literal=POSTGRES_USER='csagent' \
#     --from-literal=POSTGRES_PASSWORD="$PGPASSWORD"
#
# Better still, beyond a demo cluster: External Secrets Operator, Sealed Secrets, or your
# cloud's secret manager over CSI, and delete this file from the deployment path. A plain
# Kubernetes Secret is base64, not encryption.
apiVersion: v1
kind: Secret
metadata:
  name: ai-customer-service-go-secrets
  namespace: ai-customer-service-go
  labels:
    app.kubernetes.io/name: ai-customer-service-go
    app.kubernetes.io/component: app
type: Opaque
# stringData, not data: Kubernetes base64-encodes these. Using `data` invites someone to
# paste a base64 blob and assume it is protected.
stringData:
  # Only the selected provider's key is required, and startup fails immediately without
  # it rather than reporting healthy and 401ing every request.
  ANTHROPIC_API_KEY: "REPLACE_ME_WITH_ANTHROPIC_API_KEY"
  POSTGRES_USER: "REPLACE_ME_WITH_POSTGRES_USER"
  POSTGRES_PASSWORD: "REPLACE_ME_WITH_POSTGRES_PASSWORD"

  # The fallback provider's own key, when CHAT_FALLBACK_PROVIDER is set in the ConfigMap.
  # It is a second key, not a second use of the first: the variables are per provider.
  #
  # Start-up fails by name if it is missing, which is deliberate -- a fallback configured
  # without its credential is a fallback that works in every test and fails at the only
  # moment it exists for, while the primary is already down.
  #
  #   OPENAI_API_KEY: "REPLACE_ME_WITH_OPENAI_API_KEY"
  #   XAI_API_KEY: "REPLACE_ME_WITH_XAI_API_KEY"

  # The order service's credential, when ORDER_SERVICE_URL is configured in the ConfigMap.
  # Leave it out to answer order questions from the built-in fixture -- which the server
  # says at start-up, loudly, because a service answering from a fixture while everyone
  # believes it is talking to the order system is the failure worth preventing.
  #
  #   ORDER_SERVICE_TOKEN: "REPLACE_ME_WITH_ORDER_SERVICE_TOKEN"

  # The operations surface. `name:token[:role]`, comma separated; roles are viewer and
  # operator. It belongs here rather than in the ConfigMap because it is a credential --
  # for every customer conversation in the database, which is the most sensitive thing
  # this service holds.
  #
  # Leave it out entirely to run without an admin surface: the routes are then never
  # registered and /admin is a 404 rather than a guarded 401.
  #
  #   ADMIN_TOKENS: "alex:$(openssl rand -hex 24):operator"
