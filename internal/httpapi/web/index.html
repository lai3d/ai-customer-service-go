<!doctype html>
<meta charset="utf-8">
<title>AI Customer Service — Go</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Inline, so the browser makes no request for it. Three 404s (/favicon.ico,
     /favicon.svg, /apple-touch-icon.png) were the page's only console errors, and a
     console with a permanent error in it trains its reader to ignore the console. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2300758d'/%3E%3Cpath d='M8 12h16M8 17h11' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2300758d'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #fbfbfa; --panel: #fff; --ink: #1a1a18; --muted: #6b6b66;
    --line: #e6e4df; --accent: #00758d; --warm: #b8551f; --ok: #2d7d46;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16161a; --panel:#1e1e23; --ink:#e8e6e1; --muted:#9a978f;
            --line:#33333c; --accent:#4db8d0; --warm:#e08a52; --ok:#5cbf7a; }
  }
  * { box-sizing: border-box }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex;
           align-items:baseline; gap:12px; flex-wrap:wrap }
  header h1 { font-size:15px; margin:0; font-weight:640; letter-spacing:-.01em }
  header .sub { color:var(--muted); font-size:12.5px }
  main { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,26rem); gap:0;
         height:calc(100vh - 52px) }
  @media (max-width:900px){ main{ grid-template-columns:1fr; height:auto } }
  #chat { display:flex; flex-direction:column; min-height:0 }
  #log { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px }
  .msg { max-width:44rem; padding:10px 13px; border-radius:10px; white-space:pre-wrap;
         overflow-wrap:anywhere }
  .msg.user { align-self:flex-end; background:var(--accent); color:#fff }
  .msg.bot { align-self:flex-start; background:var(--panel); border:1px solid var(--line) }
  .msg.err { align-self:flex-start; background:transparent; border:1px solid var(--warm);
             color:var(--warm) }
  .msg p { margin:0 0 .5em }
  .msg p:last-child { margin-bottom:0 }
  .msg ul { margin:.35em 0; padding-left:1.35em }
  .msg li { margin:.15em 0 }
  .msg strong { font-weight:640 }
  .msg code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.92em;
              background:rgba(127,127,127,.16); padding:.08em .34em; border-radius:4px }
  form { display:flex; gap:8px; padding:14px 20px; border-top:1px solid var(--line) }
  input,button { font:inherit; border-radius:8px; border:1px solid var(--line) }
  input { flex:1; padding:9px 12px; background:var(--panel); color:var(--ink) }
  button { padding:9px 16px; background:var(--accent); color:#fff; border-color:transparent;
           cursor:pointer; font-weight:560 }
  button:disabled { opacity:.5; cursor:default }
  #panel { border-left:1px solid var(--line); overflow-y:auto; padding:16px;
           background:var(--panel) }
  @media (max-width:900px){ #panel{ border-left:none; border-top:1px solid var(--line) } }
  .card { border:1px solid var(--line); border-radius:9px; padding:11px 12px; margin-bottom:12px }
  .card h2 { margin:0 0 9px; font-size:11px; text-transform:uppercase;
             letter-spacing:.07em; color:var(--muted); font-weight:640 }
  .row { display:flex; justify-content:space-between; gap:10px; align-items:baseline;
         font-size:12.5px; margin-bottom:3px }
  .row .id { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px;
             overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .row .score { color:var(--muted); font-variant-numeric:tabular-nums; flex:none }
  .bar { height:3px; background:var(--accent); border-radius:2px; opacity:.55;
         margin:0 0 7px }
  .lang { color:var(--muted); font-size:10.5px; margin-left:5px }
  .kv { display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:3px }
  .kv span:last-child { font-variant-numeric:tabular-nums }
  .pill { display:inline-block; padding:1.5px 7px; border-radius:99px; font-size:11.5px;
          border:1px solid var(--line); margin:0 5px 5px 0 }
  .pill.found,.pill.created { border-color:var(--ok); color:var(--ok) }
  .pill.not_found,.pill.capped,.pill.duplicate_suppressed { border-color:var(--warm); color:var(--warm) }
  .note { color:var(--muted); font-size:11.5px; margin:0 }
  a { color:var(--accent) }
</style>

<header>
  <h1>AI Customer Service · Go</h1>
  <span class="sub">a glass box, not a chat widget — the right-hand panel is what a widget hides</span>
</header>

<main>
  <section id="chat">
    <div id="log"></div>
    <form id="form">
      <input id="input" autocomplete="off" placeholder="我的订单 ORD-10042 什么时候到？退货有时间限制吗"
             aria-label="Message">
      <button id="send" type="submit">Send</button>
    </form>
  </section>
  <aside id="panel">
    <p class="note">Send a message to see what the turn actually did.</p>
  </aside>
</main>

<script>
const log = document.getElementById('log');
const panel = document.getElementById('panel');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
let conversationId = null;

// The session, when the service is running with AUTH_MODE=session.
//
// Kept in memory rather than in sessionStorage: this page is a demonstration, a reload is
// supposed to start a fresh conversation, and a credential that outlives the page is a
// thing to explain rather than a convenience. In a real product the host page holds it.
//
// With AUTH_MODE=off the endpoint answers 404 and everything below carries on unchanged,
// which is what keeps the benchmark and the cross-repository comparison driving the same
// requests they always did.
let sessionToken = null;

// Every error bubble goes through here, and the scroll is the whole reason it exists.
//
// The log scrolled when a user message was appended and as answer chunks arrived, and not
// when an error was appended -- so a message the server refuses fills the log with the
// customer's own text and renders the explanation just below the visible area. Measured at
// 38px below the fold with a 4,001-character message against the 4,000 limit: the customer
// sees their words and no reason.
//
// Found in the .NET implementation of this system, which shares this page's shape, and
// reproduced here before it was fixed.
function showError(text) {
  log.append(el('div', 'msg err', text));
  log.scrollTop = log.scrollHeight;
}

async function ensureSession() {
  if (sessionToken) return;
  const res = await fetch('/api/v1/session', {method: 'POST'});
  if (res.status === 404) return;           // sessions are not enabled
  if (!res.ok) throw new Error('could not start a session: HTTP ' + res.status);
  sessionToken = (await res.json()).token;
}

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};

// The model writes markdown -- bold spans and hyphen lists in almost every reply -- and
// the page used to show the asterisks and hyphens to the customer, verbatim. Found by
// driving the page in a real browser; no test would have noticed, because the text was
// arriving correctly and only the rendering was wrong.
//
// This renders a deliberately small subset by building DOM nodes. No innerHTML anywhere
// on the page, so nothing the model writes is ever parsed as markup -- which matters
// more here than in an ordinary chat client, because the model's input includes
// retrieved passages, the injection path the system prompt can only ask about.
//
// Links are absent on purpose. Every other construct here is formatting; a link is a
// capability, and `[text](javascript:...)` or a model-authored href pointing anywhere is
// the one piece of markdown that does something rather than looks like something.
//
// The system prompt is untouched. Telling the model to answer in plain text would fix
// this in one sentence, and it would also make this implementation's prompt differ from
// the Java one -- and prompt parity is part of what makes the two comparable at all.
// This is a gap in a demo page, not in the system.
function renderMarkdown(container, text) {
  container.replaceChildren();
  const lines = text.split('\n');
  let list = null;

  const flushList = () => { list = null; };

  for (const line of lines) {
    const item = /^\s*[-*]\s+(.*)$/.exec(line);
    if (item) {
      if (!list) { list = el('ul'); container.append(list); }
      const li = el('li');
      appendInline(li, item[1]);
      list.append(li);
      continue;
    }
    flushList();
    if (line.trim() === '') continue;
    const p = el('p');
    appendInline(p, line);
    container.append(p);
  }
}

// appendInline handles **bold** and `code`, and appends everything else as text nodes.
function appendInline(parent, text) {
  const pattern = /\*\*([^*]+)\*\*|`([^`]+)`/g;
  let last = 0, match;
  while ((match = pattern.exec(text)) !== null) {
    if (match.index > last) parent.append(text.slice(last, match.index));
    if (match[1] !== undefined) parent.append(el('strong', null, match[1]));
    else parent.append(el('code', null, match[2]));
    last = pattern.lastIndex;
  }
  if (last < text.length) parent.append(text.slice(last));
}

function card(title) {
  const c = el('div', 'card');
  c.append(el('h2', null, title));
  panel.append(c);
  return c;
}

// Score bars are normalised within a result set rather than drawn from the raw score.
// e5 compresses cosine similarity into a narrow high band, so absolute widths make every
// bar look full and convey nothing. Relative widths show ranking, which is the part that
// is reliable -- the same finding that moved relevance filtering out of the threshold and
// into the system prompt.
function renderRetrieval(passages) {
  const c = card(`Retrieved · ${passages.length} passages`);
  const scores = passages.map(p => p.score);
  const lo = Math.min(...scores), hi = Math.max(...scores);
  for (const p of passages) {
    const row = el('div', 'row');
    const left = el('div', 'id', p.entryId);
    left.append(el('span', 'lang', p.language));
    row.append(left, el('div', 'score', p.score.toFixed(4)));
    c.append(row);
    const bar = el('div', 'bar');
    bar.style.width = (hi > lo ? 18 + 82 * (p.score - lo) / (hi - lo) : 100) + '%';
    c.append(bar);
  }
  c.append(el('p', 'note', 'Bars are relative within this result set. Absolute scores sit in a narrow band, and no threshold separates relevant from off-topic — see docs/retrieval.md.'));
}

function renderTool(tool) {
  let c = panel.querySelector('.card.tools');
  if (!c) { c = card('Tools called'); c.classList.add('tools'); }
  c.append(el('span', 'pill ' + tool.outcome, `${tool.name} → ${tool.outcome}`));
}

function renderUsage(u) {
  const c = card('What the turn cost');
  const kv = (k, v) => { const r = el('div','kv'); r.append(el('span',null,k), el('span',null,v)); c.append(r); };
  kv('model', u.model);
  kv('model calls', u.modelCalls);
  kv('input tokens', u.inputTokens.toLocaleString());
  kv('output tokens', u.outputTokens.toLocaleString());
  if (u.costUsd) kv('cost', '$' + u.costUsd.toFixed(5));
  else kv('cost', 'no price for this model');
  kv('wall', u.millis + ' ms');
  if (u.modelCalls > 1) {
    c.append(el('p','note','A tool-calling turn makes at least two model calls, and each is billed. This is their sum.'));
  }
  if (u.traceId) {
    const p = el('p','note');
    const a = el('a', null, 'open this turn in Jaeger');
    a.href = `http://localhost:16687/trace/${u.traceId}`;
    a.target = '_blank'; a.rel = 'noreferrer';
    p.append(a);
    c.append(p);
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;
  input.value = '';
  send.disabled = true;
  panel.replaceChildren();
  log.append(el('div', 'msg user', message));
  log.scrollTop = log.scrollHeight;

  const bubble = el('div', 'msg bot', '');
  log.append(bubble);
  let answer = '';

  try {
    await ensureSession();
    const res = await fetch('/api/v1/chat/stream', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        ...(sessionToken ? {'Authorization': 'Bearer ' + sessionToken} : {}),
      },
      body: JSON.stringify({conversationId, message}),
    });
    conversationId = res.headers.get('X-Conversation-Id') || conversationId;

    if (!res.ok) {
      const problem = await res.json().catch(() => ({title: 'Request failed'}));
      bubble.remove();
      showError(`${problem.title}: ${problem.detail || ''}`);
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    for (;;) {
      const {value, done} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      const frames = buffer.split('\n\n');
      buffer = frames.pop();
      for (const frame of frames) {
        // Dispatch on the SSE `event:` field, not on a field of the payload.
        //
        // The payloads are different shapes: chat events carry a `type`, but a failure
        // after the response was committed carries a problem+json object whose `type` is
        // a URI (empty here) and never the string "error". Switching on the payload
        // meant every post-commit failure -- budget exhausted, provider error, retrieval
        // failure -- was silently dropped, and the customer saw a partial answer or a
        // blank one with no indication anything had gone wrong. Found by an external
        // review; the server had been emitting the frame correctly all along.
        const lines = frame.split('\n');
        const nameLine = lines.find(l => l.startsWith('event: '));
        const dataLine = lines.find(l => l.startsWith('data: '));
        // Comment-only frames are the keep-alive: SSE connections are idle between the
        // request and the first token, and proxies close idle connections.
        if (!nameLine || !dataLine) continue;
        const name = nameLine.slice(7).trim();
        const payload = JSON.parse(dataLine.slice(6));

        if (name === 'message') {
          answer += payload.text;
          renderMarkdown(bubble, answer);
          log.scrollTop = log.scrollHeight;
        }
        else if (name === 'retrieval') renderRetrieval(payload.passages || []);
        else if (name === 'tool') renderTool(payload.tool);
        else if (name === 'usage') renderUsage(payload.usage);
        else if (name === 'error') {
          const detail = payload.detail ? `：${payload.detail}` : '';
          showError(`${payload.title || 'Error'}${detail}`);
        }
      }
    }
    if (!answer) bubble.remove();
  } catch (err) {
    bubble.remove();
    showError('The connection failed: ' + err.message);
  } finally {
    send.disabled = false;
    input.focus();
  }
});
input.focus();
</script>
