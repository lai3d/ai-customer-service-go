# Unit tests for the alert rules, run by `scripts/check-rules.sh` with Prometheus's own
# promtool against synthetic series.
#
# The Go test next door proves every alert names a series the application really emits.
# It cannot prove the alert fires: an expression can be valid, name real metrics, and
# still be wrong -- a threshold with the comparison the wrong way round, a `for` longer
# than the range, a ratio that goes empty exactly when everything is broken. So each alert
# here is shown firing on data that should trip it, and the ones where silence is the
# interesting half are shown *not* firing on data that should not.
#
# Assertions are written against the synthetic `ALERTS` series rather than with
# `alert_rule_test`, which compares annotations word for word and would make every
# description in the rules a second copy living here.
rule_files:
  - rules.yaml
evaluation_interval: 1m

tests:
  # 20% of turns failing: over the 14.4x fast-burn threshold and the 6x slow one.
  - interval: 1m
    name: turns failing well past the objective
    input_series:
      - series: 'chat_turns_total{outcome="completed"}'
        values: "0+8x480"
      - series: 'chat_turns_total{outcome="failed"}'
        values: "0+2x480"
    promql_expr_test:
      - expr: 'ALERTS{alertname="TurnFailureBudgetBurningFast", alertstate="firing"}'
        eval_time: 90m
        exp_samples:
          - labels: 'ALERTS{alertname="TurnFailureBudgetBurningFast", alertstate="firing", severity="critical"}'
            value: 1
      - expr: 'ALERTS{alertname="TurnFailureBudgetBurningSlow", alertstate="firing"}'
        eval_time: 7h
        exp_samples:
          - labels: 'ALERTS{alertname="TurnFailureBudgetBurningSlow", alertstate="firing", severity="warning"}'
            value: 1

  # The other half of the check: an alert that fires on healthy traffic is worse than
  # none, because it is the one people learn to ignore.
  #
  # Healthy here means *not perfect*. About one turn in a hundred fails and one model call
  # in a hundred errors, both well inside the objective, because a dataset with no
  # failures at all cannot catch a threshold that is too low: the failure ratios go empty
  # rather than small, and an empty expression fires nothing however wrong the comparison
  # is. Forced red by loosening a threshold, which is what found that.
  - interval: 1m
    name: a healthy service raises nothing
    input_series:
      - series: 'chat_turns_total{outcome="completed"}'
        values: "0+100x480"
      - series: 'chat_turns_total{outcome="failed"}'
        values: "0+1x480"
      - series: 'chat_turn_duration_seconds_count{model="claude-opus-5"}'
        values: "0+101x480"
      - series: 'chat_turn_duration_seconds_bucket{model="claude-opus-5", le="16"}'
        values: "0+100x480"
      - series: 'chat_model_calls_total{model="claude-opus-5", outcome="success"}'
        values: "0+120x480"
      - series: 'chat_model_calls_total{model="claude-opus-5", outcome="error"}'
        values: "0+1x480"
      - series: 'chat_cost_usd_total{model="claude-opus-5"}'
        values: "0+0.05x480"
      - series: 'chat_handoff_notifications_total{type="ticket.created", outcome="delivered"}'
        values: "0+1x480"
      # A public endpoint refuses somebody constantly -- a client retrying, a stale token,
      # a session that expired mid-conversation -- and one subject sits on the wrong side
      # of the per-minute limit. Both are the ordinary state of a healthy service, and both
      # are here rather than absent for the same reason the failure ratios are not zero: a
      # refusal series that does not exist makes the refusal ratio empty, and an empty
      # expression fires nothing however wrong the threshold is.
      - series: 'chat_edge_refusals_total{reason="rate_limited"}'
        values: "0+1x480"
      - series: 'chat_edge_refusals_total{reason="no_session"}'
        values: "0+1x480"
      - series: 'chat_rate_limited_subjects{instance="10.0.0.1:8081", job="ai-customer-service-go"}'
        values: "1x480"
      # One turn in a hundred failing over, for the same reason the failure ratios are not
      # zero: no failover series at all makes the ratio empty, and an empty expression
      # fires nothing however wrong the threshold is. A provider having a bad minute is a
      # healthy day, not an incident.
      - series: 'chat_provider_failovers_total{from="anthropic", to="openai", reason="unavailable"}'
        values: "0+1x480"
      - series: 'up{job="ai-customer-service-go", instance="10.0.0.1:8081"}'
        values: "1x480"
    promql_expr_test:
      - expr: "ALERTS"
        eval_time: 7h
        exp_samples: []

  # Every turn failing, and none completing at all. This is the case the ratio is written
  # backwards to survive: `1 - completed/all` is empty here, because the completed series
  # does not exist, and an empty expression fires nothing.
  - interval: 1m
    name: total outage, with no completed turns to divide by
    input_series:
      - series: 'chat_turns_total{outcome="failed"}'
        values: "0+10x480"
    promql_expr_test:
      - expr: 'ALERTS{alertname="TurnFailureBudgetBurningFast", alertstate="firing"}'
        eval_time: 90m
        exp_samples:
          - labels: 'ALERTS{alertname="TurnFailureBudgetBurningFast", alertstate="firing", severity="critical"}'
            value: 1

  # 20% of turns slower than 16 s: past the 10% objective miss, short of the 25% one.
  - interval: 1m
    name: a fifth of turns slower than the objective
    input_series:
      - series: 'chat_turn_duration_seconds_count{model="claude-opus-5"}'
        values: "0+10x480"
      - series: 'chat_turn_duration_seconds_bucket{model="claude-opus-5", le="16"}'
        values: "0+8x480"
    promql_expr_test:
      - expr: 'ALERTS{alertname="TurnsSlowerThanTheObjective", alertstate="firing"}'
        eval_time: 90m
        exp_samples:
          - labels: 'ALERTS{alertname="TurnsSlowerThanTheObjective", alertstate="firing", severity="warning"}'
            value: 1
      - expr: 'ALERTS{alertname="TurnsFarSlowerThanTheObjective", alertstate="firing"}'
        eval_time: 90m
        exp_samples: []

  # 40% slower than 16 s: the step-change rule as well.
  - interval: 1m
    name: two fifths of turns far slower than the objective
    input_series:
      - series: 'chat_turn_duration_seconds_count{model="claude-opus-5"}'
        values: "0+10x480"
      - series: 'chat_turn_duration_seconds_bucket{model="claude-opus-5", le="16"}'
        values: "0+6x480"
    promql_expr_test:
      - expr: 'ALERTS{alertname="TurnsFarSlowerThanTheObjective", alertstate="firing"}'
        eval_time: 90m
        exp_samples:
          - labels: 'ALERTS{alertname="TurnsFarSlowerThanTheObjective", alertstate="firing", severity="critical"}'
            value: 1

  - interval: 1m
    name: the target stops being scraped
    input_series:
      - series: 'up{job="ai-customer-service-go", instance="10.0.0.1:8081"}'
        values: "1x10 0x30"
    promql_expr_test:
      - expr: 'ALERTS{alertname="AppTargetDown", alertstate="firing"}'
        eval_time: 30m
        exp_samples:
          - labels: 'ALERTS{alertname="AppTargetDown", alertstate="firing", instance="10.0.0.1:8081", job="ai-customer-service-go", severity="critical"}'
            value: 1

  # One model call that could not be priced. It fires on one, and the model id rides on
  # the alert so the price table can be fixed without going looking.
  - interval: 1m
    name: a model with no price entry
    input_series:
      - series: 'chat_unpriced_model_calls_total{model="gpt-5-2025-08-07"}'
        values: "0x10 1x30"
    promql_expr_test:
      - expr: 'ALERTS{alertname="UnpricedModelCalls", alertstate="firing"}'
        eval_time: 30m
        exp_samples:
          - labels: 'ALERTS{alertname="UnpricedModelCalls", alertstate="firing", model="gpt-5-2025-08-07", severity="warning"}'
            value: 1

  - interval: 1m
    name: one model call in ten failing at the provider
    input_series:
      - series: 'chat_model_calls_total{model="claude-opus-5", outcome="success"}'
        values: "0+9x60"
      - series: 'chat_model_calls_total{model="claude-opus-5", outcome="error"}'
        values: "0+1x60"
    promql_expr_test:
      - expr: 'ALERTS{alertname="ProviderCallsFailing", alertstate="firing"}'
        eval_time: 40m
        exp_samples:
          - labels: 'ALERTS{alertname="ProviderCallsFailing", alertstate="firing", severity="warning"}'
            value: 1

  # Four conversations cut off in fifteen minutes, against a threshold of three: the rule
  # tolerates the budget doing its job and notices it doing it constantly.
  - interval: 1m
    name: conversations cut off by the token budget
    input_series:
      - series: 'chat_turns_total{outcome="budget_exceeded"}'
        values: "0+1x60"
      - series: 'chat_turns_total{outcome="completed"}'
        values: "0+50x60"
    promql_expr_test:
      - expr: 'ALERTS{alertname="BudgetExceededTurns", alertstate="firing"}'
        eval_time: 40m
        exp_samples:
          - labels: 'ALERTS{alertname="BudgetExceededTurns", alertstate="firing", outcome="budget_exceeded", severity="warning"}'
            value: 1

  - interval: 1m
    name: one conversation cut off is not an alert
    input_series:
      - series: 'chat_turns_total{outcome="budget_exceeded"}'
        values: "0x20 1x40"
      - series: 'chat_turns_total{outcome="completed"}'
        values: "0+50x60"
    promql_expr_test:
      - expr: 'ALERTS{alertname="BudgetExceededTurns", alertstate="firing"}'
        eval_time: 40m
        exp_samples: []

  - interval: 1m
    name: a turn hits the tool-round cap
    input_series:
      - series: 'chat_turns_total{outcome="tool_limit"}'
        values: "0x10 1x60"
      - series: 'chat_turns_total{outcome="completed"}'
        values: "0+50x70"
    promql_expr_test:
      - expr: 'ALERTS{alertname="TurnsHittingTheToolRoundCap", alertstate="firing"}'
        eval_time: 30m
        exp_samples:
          - labels: 'ALERTS{alertname="TurnsHittingTheToolRoundCap", alertstate="firing", outcome="tool_limit", severity="warning"}'
            value: 1

  # The event type is on the alert, because "a ticket was raised and nobody was told" and
  # "an operator answered and nobody was told" are different things to go and fix.
  - interval: 1m
    name: a handoff notification that never arrived
    input_series:
      - series: 'chat_handoff_notifications_total{type="ticket.created", outcome="failed"}'
        values: "0x10 1x30"
      - series: 'chat_handoff_notifications_total{type="ticket.created", outcome="delivered"}'
        values: "0+1x40"
    promql_expr_test:
      - expr: 'ALERTS{alertname="HandoffNotificationsUndelivered", alertstate="firing"}'
        eval_time: 20m
        exp_samples:
          - labels: 'ALERTS{alertname="HandoffNotificationsUndelivered", alertstate="firing", outcome="failed", type="ticket.created", severity="warning"}'
            value: 1

  # $12/hour against a $5 threshold.
  - interval: 1m
    name: spending faster than the ceiling
    input_series:
      - series: 'chat_cost_usd_total{model="claude-opus-5"}'
        values: "0+0.2x120"
    promql_expr_test:
      - expr: 'ALERTS{alertname="CostBurnRate", alertstate="firing"}'
        eval_time: 90m
        exp_samples:
          - labels: 'ALERTS{alertname="CostBurnRate", alertstate="firing", severity="warning"}'
            value: 1

  # The day's ceiling, reached. It fires on one refusal, because one refusal here means
  # every customer is being refused until midnight UTC rather than one being unlucky.
  - interval: 1m
    name: the daily token budget is spent
    input_series:
      - series: 'chat_edge_refusals_total{reason="daily_budget"}'
        values: "0x10 1+1x30"
      - series: 'chat_turns_total{outcome="completed"}'
        values: "0+10x40"
    promql_expr_test:
      - expr: 'ALERTS{alertname="DailyTokenBudgetExhausted", alertstate="firing"}'
        eval_time: 30m
        exp_samples:
          - labels: 'ALERTS{alertname="DailyTokenBudgetExhausted", alertstate="firing", reason="daily_budget", severity="critical"}'
            value: 1

  # A rate limiter refusing a third of everything asked of this service. The turns that do
  # run are healthy, which is the point: every rule in the SLO group is quiet here.
  - interval: 1m
    name: a third of requests refused before a turn starts
    input_series:
      - series: 'chat_edge_refusals_total{reason="rate_limited"}'
        values: "0+5x60"
      - series: 'chat_turns_total{outcome="completed"}'
        values: "0+10x60"
    promql_expr_test:
      - expr: 'ALERTS{alertname="CustomersRefusedAtTheEdge", alertstate="firing"}'
        eval_time: 40m
        exp_samples:
          - labels: 'ALERTS{alertname="CustomersRefusedAtTheEdge", alertstate="firing", severity="warning"}'
            value: 1
      - expr: 'ALERTS{alertname="TurnFailureBudgetBurningFast", alertstate="firing"}'
        eval_time: 40m
        exp_samples: []

  # The case the denominator is written for. Everything is refused and no turn runs at all,
  # so chat_turns_total has no series -- `refusals / turns` would be empty here and fire
  # nothing, in exactly the situation worth waking somebody for.
  - interval: 1m
    name: every request refused, with no turns to divide by
    input_series:
      - series: 'chat_edge_refusals_total{reason="no_session"}'
        values: "0+10x60"
    promql_expr_test:
      - expr: 'ALERTS{alertname="CustomersRefusedAtTheEdge", alertstate="firing"}'
        eval_time: 40m
        exp_samples:
          - labels: 'ALERTS{alertname="CustomersRefusedAtTheEdge", alertstate="firing", severity="warning"}'
            value: 1

  # Repeat offenders. The gauge is sampled per replica against the same rows, so two
  # replicas reporting four subjects are four subjects and not eight: max(), not sum().
  - interval: 1m
    name: several subjects hitting the per-minute limit again and again
    input_series:
      - series: 'chat_rate_limited_subjects{instance="10.0.0.1:8081", job="ai-customer-service-go"}'
        values: "4x60"
      - series: 'chat_rate_limited_subjects{instance="10.0.0.2:8081", job="ai-customer-service-go"}'
        values: "4x60"
    promql_expr_test:
      - expr: 'ALERTS{alertname="RepeatedlyRateLimitedSubjects", alertstate="firing"}'
        eval_time: 40m
        exp_samples:
          - labels: 'ALERTS{alertname="RepeatedlyRateLimitedSubjects", alertstate="firing", severity="warning"}'
            value: 1

  # Two of them is the threshold, not past it: a couple of clients that retry too fast are
  # the ordinary state of a public endpoint.
  - interval: 1m
    name: two repeat offenders is not an alert
    input_series:
      - series: 'chat_rate_limited_subjects{instance="10.0.0.1:8081", job="ai-customer-service-go"}'
        values: "2x60"
    promql_expr_test:
      - expr: 'ALERTS{alertname="RepeatedlyRateLimitedSubjects", alertstate="firing"}'
        eval_time: 40m
        exp_samples: []

  # A fifth of turns answered by the second provider: the primary is down and every alert
  # about turns is quiet, because the customers are being answered.
  - interval: 1m
    name: the primary provider is down and the fallback is carrying the traffic
    input_series:
      - series: 'chat_turns_total{outcome="completed"}'
        values: "0+10x480"
      - series: 'chat_provider_failovers_total{from="anthropic", to="openai", reason="unavailable"}'
        values: "0+2x480"
    promql_expr_test:
      - expr: 'ALERTS{alertname="RunningOnTheFallbackProvider", alertstate="firing"}'
        eval_time: 90m
        exp_samples:
          - labels: 'ALERTS{alertname="RunningOnTheFallbackProvider", alertstate="firing", severity="warning"}'
            value: 1
      # And nothing else, which is the point of the alert existing: the turns all
      # completed, so every objective above is being met while the service runs on a
      # provider nobody chose.
      - expr: 'ALERTS{alertname!="RunningOnTheFallbackProvider"}'
        eval_time: 90m
        exp_samples: []
