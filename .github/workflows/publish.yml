# Publish the two images to GHCR, tagged by the git tag and pinned by digest.
#
# It runs on a tag, never on a branch. A registry tag that moves is the problem this is
# meant to solve, and `main` moving would recreate it under a different name.
#
# What the job prints at the end is the point: the digest. `docs/deployment.md` has the
# rollout that uses it. A tag says which build somebody meant; a digest says which build
# is running, and only one of those two survives someone re-tagging by hand.
name: Publish images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish as (e.g. 0.2.0)"
        required: true

permissions:
  contents: read
  packages: write
  # For the build provenance attestation below: it signs a statement about what this
  # workflow built, so a digest can be traced back to a commit and a run.
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      # Independent images, and one failing should not hide the other's digest.
      fail-fast: false
      matrix:
        include:
          - name: ai-customer-service-go
            context: .
            file: Dockerfile
          - name: ai-customer-service-go-admin-ui
            context: admin-ui
            file: admin-ui/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the version
        id: version
        run: |
          v="${{ github.event.inputs.tag }}"
          [ -n "$v" ] || v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          # linux/amd64 only, and that is a decision rather than an oversight. This image
          # compiles cgo against a Rust static library and an ONNX Runtime shared object,
          # so a linux/arm64 build under QEMU emulation is a Go+C++ compile at roughly a
          # tenth of native speed on top of a 470 MB download. Anyone on arm64 builds
          # locally -- which is exactly what k8s/kind/verify.sh does on this machine --
          # and a native arm64 runner is the fix when one is worth paying for.
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:sha-${{ github.sha }}
          # No :latest. It is the tag that makes "what is running in production" an
          # unanswerable question, and k8s/kind/verify.sh asserts no manifest carries one.
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Report the digest to pin
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo
            echo '```'
            echo "ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}@${{ steps.push.outputs.digest }}"
            echo '```'
            echo
            echo "Put that in k8s/deployment.yaml (or k8s/admin-ui.yaml) and re-run"
            echo "\`k8s/kind/verify.sh\`. See docs/deployment.md."
          } >> "$GITHUB_STEP_SUMMARY"
